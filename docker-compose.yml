services:
  # 1. Database (PostgreSQL)
  irm-db:
    image: postgres:16-alpine
    container_name: irm-db
    environment:
      TZ: Asia/Bangkok
      POSTGRES_DB: irm
      POSTGRES_USER: irm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-irm_dev_2026}
    volumes:
      - irm_pgdata:/var/lib/postgresql/data
    networks:
      - irm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irm"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 2. Redis Cache
  irm-redis:
    image: redis:7-alpine
    container_name: irm-redis
    environment:
      TZ: Asia/Bangkok
    volumes:
      - irm_redis:/data
    networks:
      - irm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 3. Backend (FastAPI)
  irm-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irm-backend
    environment:
      TZ: Asia/Bangkok
      DB_HOST: irm-db
      DB_PORT: 5432
      DB_NAME: irm
      DB_USER: irm
      DB_PASSWORD: ${DB_PASSWORD:-irm_dev_2026}
      REDIS_HOST: irm-redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-irm-dev-secret-key-2026}
      APP_BASE_URL: ${APP_BASE_URL:-https://irm.windowasia.com}
      BACKEND_URL: ${BACKEND_URL:-https://irm.windowasia.com/api}
      FRONTEND_URL: ${FRONTEND_URL:-https://irm.windowasia.com}
    networks:
      - irm-network
    depends_on:
      irm-db:
        condition: service_healthy
      irm-redis:
        condition: service_healthy
    restart: unless-stopped

  # 4. Frontend (Next.js)
  irm-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: irm-frontend
    environment:
      TZ: Asia/Bangkok
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://irm.windowasia.com/api}
    networks:
      - irm-network
    depends_on:
      - irm-backend
    restart: unless-stopped

  # 5. Reverse Proxy & Traefik Integration
  irm-nginx:
    image: nginx:alpine
    container_name: irm-nginx
    environment:
      TZ: Asia/Bangkok
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - irm-network
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      # HTTPS Router
      - "traefik.http.routers.irm.rule=Host(`irm.windowasia.com`)"
      - "traefik.http.routers.irm.entrypoints=websecure"
      - "traefik.http.routers.irm.tls=true"
      - "traefik.http.routers.irm.tls.certresolver=letsencrypt"
      - "traefik.http.services.irm.loadbalancer.server.port=80"
      # HTTP Router (Auto fallback/redirect)
      - "traefik.http.routers.irm-http.rule=Host(`irm.windowasia.com`)"
      - "traefik.http.routers.irm-http.entrypoints=web"
      - "traefik.http.routers.irm-http.middlewares=irm-redirect-https"
      - "traefik.http.middlewares.irm-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.irm-redirect-https.redirectscheme.permanent=true"
    depends_on:
      - irm-frontend
      - irm-backend
    restart: unless-stopped

networks:
  irm-network:
    name: irm-network
    driver: bridge
  traefik-proxy:
    external: true

volumes:
  irm_pgdata:
  irm_redis:
